services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mmas
      POSTGRES_PASSWORD: mmas
      POSTGRES_DB: mmas_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmas -d mmas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mmas:mmas@db:5432/mmas_db
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mmas:mmas@db:5432/mmas_db
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    profiles:
      - migrate

volumes:
  pgdata:
